<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Có một chiếc thiệp dành cho bạn 💗</title>
  <meta name="description" content="Một chút Tình Tính Ting Ting đang chờ bạn khám phá." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tttt-invitation.vercel.app/" />
  <meta property="og:title" content="Có một chiếc thiệp dành cho bạn 💗" />
  <meta property="og:description" content="Một chút Tình Tính Ting Ting đang chờ bạn khám phá." />
  <meta property="og:image" content="https://tttt-invitation.vercel.app/assets/invitation-preview.png" />
  <meta property="og:image:secure_url" content="https://tttt-invitation.vercel.app/assets/invitation-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1731" />
  <meta property="og:image:height" content="909" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />

  <style id="bootScreenStyles">
    #stageCanvas,
    #stageUi,
    .stage-header {
      visibility: hidden;
    }

    body.stage-boot-complete #stageCanvas,
    body.stage-boot-complete #stageUi,
    body.stage-boot-complete .stage-header {
      visibility: visible;
    }

    #bootScreen {
      position: absolute;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      box-sizing: border-box;
      color: #fff8f2;
      text-align: center;
      background: radial-gradient(ellipse at 50% 30%, #313d88 0%, #171d5a 52%, #080d30 100%);
      font-family: 'Be Vietnam Pro', sans-serif;
      transition: opacity .35s ease, visibility .35s ease;
      overflow: hidden;
    }

    #bootScreen:before,
    #bootScreen:after {
      content: '';
      position: absolute;
      inset: -14%;
      pointer-events: none;
      background: radial-gradient(ellipse at 10% 10%, transparent 34%, rgba(160, 116, 255, .38) 35%, rgba(39, 48, 139, .12) 48%, transparent 61%);
      filter: blur(5px);
      transform: rotate(-18deg)
    }

    #bootScreen:after {
      transform: rotate(158deg) scale(1.15);
      opacity: .7
    }

    #bootScreen.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-inner {
      width: min(320px, 100%);
      display: flex;
      align-items: center;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .boot-brand {
      width: min(190px, 65%);
      max-height: 100px;
      object-fit: contain;
      margin-bottom: 26px;
    }

    .boot-gummies {
      height: 118px;
      width: 260px;
      max-width: 100%;
      position: relative;
      margin-bottom: 17px;
    }

    .boot-gummy {
      position: absolute;
      display: block;
      border: 2px solid rgba(255, 255, 255, .35);
      box-shadow: inset -8px -11px 18px rgba(75, 16, 78, .16), inset 7px 8px 16px rgba(255, 255, 255, .46), 0 13px 25px rgba(7, 1, 20, .25);
      animation: boot-bob 1.75s ease-in-out infinite alternate;
    }

    .boot-gummy:before,
    .boot-gummy:after {
      content: '';
      position: absolute;
      width: 5px;
      height: 7px;
      background: #432447;
      border-radius: 50%;
      top: 42%;
    }

    .boot-gummy:before {
      left: 34%;
    }

    .boot-gummy:after {
      right: 34%;
    }

    .boot-gummy:nth-child(1) {
      width: 62px;
      height: 71px;
      left: 3px;
      top: 26px;
      background: linear-gradient(135deg, #ffd5eb, #f19dbf);
      border-radius: 47% 54% 45% 55%;
      animation-delay: -.4s
    }

    .boot-gummy:nth-child(2) {
      width: 59px;
      height: 65px;
      left: 54px;
      top: 8px;
      background: linear-gradient(135deg, #fff0a6, #ffc967);
      border-radius: 55% 45% 53% 47%;
      animation-delay: -1s
    }

    .boot-gummy:nth-child(3) {
      width: 70px;
      height: 76px;
      left: 103px;
      top: 32px;
      background: linear-gradient(135deg, #dbfff2, #8bdcc5);
      border-radius: 52% 48% 55% 46%;
      animation-delay: -.1s
    }

    .boot-gummy:nth-child(4) {
      width: 56px;
      height: 67px;
      left: 161px;
      top: 10px;
      background: linear-gradient(135deg, #f4d9ff, #c3a0ed);
      border-radius: 46% 56% 49% 53%;
      animation-delay: -.8s
    }

    .boot-gummy:nth-child(5) {
      width: 59px;
      height: 65px;
      left: 202px;
      top: 29px;
      background: linear-gradient(135deg, #ffe9c1, #eeadcc);
      border-radius: 55% 45% 52% 49%;
      animation-delay: -1.4s
    }

    @keyframes boot-bob {
      from {
        transform: translateY(6px) scale(.97) rotate(-3deg)
      }

      to {
        transform: translateY(-7px) scale(1.04) rotate(3deg)
      }
    }

    .boot-title {
      font-size: clamp(18px, 4.2vw, 24px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -.035em;
      margin: 0;
      white-space: nowrap;
    }

    .boot-progress {
      width: min(240px, 76vw);
      height: 7px;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 25px;
      background: rgba(255, 255, 255, .14);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, .24)
    }

    .boot-progress i {
      display: block;
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f4a6d1, #f6d8ff, #ffe0a4);
      box-shadow: 0 0 12px rgba(255, 214, 246, .9);
      animation: boot-progress 1.25s ease-in-out infinite alternate
    }

    @keyframes boot-progress {
      from {
        transform: translateX(-105%)
      }

      to {
        transform: translateX(235%)
      }
    }

    .boot-error {
      display: none;
      max-width: 300px;
      color: #ffe4e7;
      line-height: 1.5;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .boot-retry {
      display: none;
      border: 0;
      border-radius: 28px;
      background: #ffe0ad;
      color: #34163b;
      font: 700 14px 'Be Vietnam Pro', sans-serif;
      padding: 13px 25px;
      margin-top: 20px;
      cursor: pointer;
      transition: background .2s ease, transform .15s ease, opacity .2s ease;
    }

    .boot-retry:disabled {
      cursor: wait;
      opacity: 0.85;
    }

    /* Troll Modal */
    .troll-modal {
      position: absolute;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .troll-modal.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .troll-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 13, 48, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .troll-card {
      position: relative;
      z-index: 1;
      width: min(480px, 94%);
      background: linear-gradient(145deg, #2b1f48, #181232);
      border: 1.5px solid rgba(255, 214, 246, 0.35);
      border-radius: 24px;
      padding: 20px 16px 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 105, 180, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      transform: scale(0.92);
      transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .troll-modal.is-visible .troll-card {
      transform: scale(1);
    }

    .troll-badge {
      display: inline-block;
      background: #ff3366;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
    }

    .troll-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin: 0 0 4px;
      line-height: 1.3;
    }

    .troll-subtitle {
      font-size: 14px;
      color: #ffd0e8;
      margin: 0 0 12px;
      line-height: 1.4;
    }

    .troll-video-wrapper {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 50vh;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 12px;
    }

    .troll-video-wrapper video,
    .troll-video-wrapper iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      display: block;
    }

    .troll-hint {
      font-size: 12px;
      color: #ffe0ad;
      margin: 0 0 14px;
      line-height: 1.4;
    }

    .troll-close-btn {
      border: 0;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font: 600 13px 'Be Vietnam Pro', sans-serif;
      padding: 10px 20px;
      cursor: pointer;
      transition: background .2s ease, transform .1s ease;
    }

    .troll-close-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .troll-close-btn:active {
      transform: scale(0.96);
    }

    #bootScreen.is-error .boot-progress {
      display: none;
    }

    #bootScreen.is-error .boot-error,
    #bootScreen.is-error .boot-retry {
      display: block;
    }

    @media (prefers-reduced-motion:reduce) {

      .boot-gummy,
      .boot-progress i {
        animation: none !important
      }

      #bootScreen {
        transition: none
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- 9:16 Responsive Mobile Container -->
    <main class="stage-container" id="stageContainer" role="region" aria-label="Interactive Invitation Stage">

      <div id="bootScreen" role="status" aria-live="polite">
        <div class="boot-inner">
          <img class="boot-brand" src="/assets/brand/logo-white.png" alt="Tình Tính Ting Ting" />
          <div class="boot-gummies" aria-hidden="true"><i class="boot-gummy"></i><i class="boot-gummy"></i><i
              class="boot-gummy"></i><i class="boot-gummy"></i><i class="boot-gummy"></i></div>
          <h1 class="boot-title">Một chút phép màu đang đến...</h1>
          <div class="boot-progress" aria-hidden="true"><i></i></div>
          <p class="boot-error" id="bootError"></p>
          <button id="bootRetry" class="boot-retry" type="button">Thử lại</button>
        </div>

        <!-- Troll Modal for Curious Devs -->
        <div id="trollModal" class="troll-modal" style="display: none;" aria-hidden="true">
          <div class="troll-backdrop"></div>
          <div class="troll-card">
            <h2 class="troll-title">ơ Hello</h2>
            <p class="troll-subtitle">thật sự là không có gì đâu.</p>
            <div class="troll-video-wrapper">
              <video id="trollVideo" src="/assets/troll.mp4" playsinline controls loop preload="auto"></video>
            </div>
            <button id="trollCloseBtn" class="troll-close-btn" type="button">Quay lại</button>
          </div>
        </div>
      </div>
      <!-- Spatial Lighting Background Glows -->
      <div class="stage-ribbons" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b><b></b><b></b></div>
      <div class="stage-bg-glow stage-bg-glow-top"></div>
      <div class="stage-bg-glow stage-bg-glow-center"></div>

      <!-- Official brand logo at top -->
      <header class="stage-header">
        <img src="/assets/brand/logo-white.png" alt="Tình Tính Ting Ting" class="brand-logo" />
      </header>

      <!-- Shared Poisson-heightfield material; Canvas stays above for faces/input. -->
      <canvas id="mochiCanvas" aria-hidden="true"></canvas>
      <!-- Canvas for face/particle overlays and interaction input -->
      <canvas id="stageCanvas"></canvas>

      <!-- Presentation Mode UI Layers -->
      <div class="stage-ui" id="stageUi">
        <!-- Playful touch prompt -->
        <div class="touch-hint" id="touchHint" aria-hidden="true">
          <div class="cloud-pill">
            <span>Ê ê, kéo thử đi</span>
          </div>
        </div>

        <!-- Mid/Bottom Action Area -->
        <div class="stage-actions">
          <!-- CTA: "MỞ LỜI MỜI" (Appears after name reveal) -->
          <div class="cta-container" id="ctaContainer" style="display: none;">
            <button class="btn-open-invite" id="btnOpenInvite" type="button">
              <span class="btn-envelope-icon">💌</span>
              <span class="btn-text">Có gì trong này ta?</span>
            </button>

            <div class="sub-actions">
              <button class="btn-sub" id="btnPlayMore" type="button" title="↺">
                <span>↺</span>
              </button>
              <button class="btn-sub" id="btnReplay" type="button" title="↺">
                <span>↺</span>
              </button>
            </div>
          </div>

          <!-- Bottom Shortcut Pill (Always visible from t=0) -->
          <div class="shortcut-container" id="shortcutContainer">
            <button class="shortcut-pill" id="btnShortcut" type="button">
              <span>Kiên nhẫn kém "zone"</span>
              <svg class="shortcut-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- INVITATION POPUP MODAL (Based on Approved Reference Screen 3 & organic-card-blank.svg) -->
      <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"
        aria-hidden="true">
        <div class="modal-card" id="modalCard" tabindex="-1">
          <!-- Organic SVG Background Graphic Asset -->
          <div class="modal-card-bg" aria-hidden="true">
            <img src="/assets/invitation/organic-card-blank.svg" alt="" class="card-bg-img" />
          </div>

          <!-- Close Button (X) (Floating on top-right shoulder of card) -->
          <button class="modal-close-btn" id="modalCloseBtn" type="button" aria-label="Đóng thiệp">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>

          <!-- Scrollable HTML Content Layer Layered Over Asset -->
          <div class="modal-card-content">
            <!-- Card Content Header -->
            <div class="card-header">
              <span class="card-salutation">Có một chiếc hẹn với bạn</span>
              <div class="card-logo-wrap">
                <img src="/assets/brand/logo-white.png" alt="Tình Tính Ting Ting" class="card-logo" />
              </div>
              <p class="guest-personal-msg" id="modalGuestMsg" style="display: none;"></p>
              <p class="card-description" id="modalDescription"></p>
            </div>

            <!-- Dotted Divider -->
            <div class="card-divider" id="modalDividerTop"></div>

            <!-- Event Details (Date, Time, Venue) -->
            <div class="event-details-list" id="modalDetailsContainer">
              <div class="detail-row" id="rowDate">
                <div class="detail-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                </div>
                <span class="detail-text" id="textDate"></span>
              </div>

              <div class="detail-row" id="rowTime">
                <div class="detail-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                </div>
                <span class="detail-text" id="textTime"></span>
              </div>

              <div class="detail-row" id="rowVenue">
                <div class="detail-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                  </svg>
                </div>
                <span class="detail-text" id="textVenue"></span>
              </div>
            </div>

            <!-- Dotted Divider -->
            <div class="card-divider" id="modalDividerBottom"></div>

            <!-- Social Action Pills -->
            <div class="social-links-row" id="modalSocialContainer">
              <div class="social-links-line">
                <a href="#" class="social-pill social-fb" id="btnSocialFb" target="_blank" rel="noopener noreferrer"
                  title="Facebook">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                  </svg>
                </a>
                <a href="#" class="social-pill social-ig" id="btnSocialIg" target="_blank" rel="noopener noreferrer"
                  title="Instagram">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                  </svg>
                </a>
                <a class="social-pill social-tiktok" id="btnSocialTiktok" target="_blank" rel="noopener noreferrer"
                  title="TikTok">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path
                      d="M16.6 5.82A4.84 4.84 0 0 1 13.5 2h-3.2v13.3a2.7 2.7 0 1 1-2.3-2.67v-3.25A6 6 0 1 0 13.5 15V8.2a8 8 0 0 0 4.7 1.53V6.55a4.86 4.86 0 0 1-1.6-.73Z" />
                  </svg>
                </a>
              </div>
              <div class="social-links-line">
                <a href="#" class="social-pill social-web" id="btnSocialWeb" target="_blank" rel="noopener noreferrer"
                  title="Website">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path
                      d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                    </path>
                  </svg>
                </a>
                <a class="social-pill social-maps" id="btnSocialMaps" target="_blank" rel="noopener noreferrer"
                  title="Google Maps">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
                    aria-hidden="true">
                    <path d="M12 21s7-6.1 7-12A7 7 0 1 0 5 9c0 5.9 7 12 7 12Z" />
                    <circle cx="12" cy="9" r="2.2" />
                  </svg>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
