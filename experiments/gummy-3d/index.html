<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Three.js Gummy 3D Rendering Experiment — TÌNH TÍNH TING TING</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <main class="stage-container" id="stageContainer" role="region" aria-label="Three.js Gummy 3D Experiment">
        <!-- Header with logo and back link -->
        <header class="stage-header">
          <a href="/" class="back-link" title="Quay lại Canvas 2D">← Canvas 2D</a>
          <img src="/assets/brand/logo-white.png" alt="Tình Tính Ting Ting" class="brand-logo" />
          <button id="toggleControlsBtn" class="toggle-btn" type="button" title="Tùy chỉnh chất liệu">⚙️</button>
        </header>

        <!-- WebGL Canvas Container -->
        <div id="webglContainer" class="webgl-canvas-container"></div>

        <!-- WebGL Fallback container (hidden if WebGL supported) -->
        <div id="webglFallback" class="webgl-fallback" style="display: none;">
          <p>Thiết bị không hỗ trợ WebGL. Vui lòng quay lại bản <a href="/">Canvas 2D</a>.</p>
        </div>

        <!-- Minimal 3D Controls Panel -->
        <aside class="controls-panel" id="controlsPanel">
          <div class="panel-header">
            <span class="panel-title">THƯ NGIỆM 3D GUMMY</span>
            <span class="fps-tag" id="fpsTag">60 FPS</span>
          </div>

          <!-- Preset selector -->
          <div class="control-group">
            <label class="control-label">Chất liệu Preset</label>
            <div class="preset-buttons">
              <button class="preset-btn active" data-preset="jelly" type="button">Thạch Jelly</button>
              <button class="preset-btn" data-preset="candy" type="button">Kẹo Dẻo Sáng</button>
              <button class="preset-btn" data-preset="mochi" type="button">Mochi Satin</button>
            </div>
          </div>

          <!-- Material Sliders -->
          <div class="control-group">
            <div class="slider-header">
              <span>Độ nhám (Roughness)</span>
              <span id="valRoughness">0.24</span>
            </div>
            <input type="range" id="sliderRoughness" min="0.05" max="0.6" step="0.01" value="0.24" />
          </div>

          <div class="control-group">
            <div class="slider-header">
              <span>Độ trong suốt (Transmission)</span>
              <span id="valTransmission">0.55</span>
            </div>
            <input type="range" id="sliderTransmission" min="0.0" max="0.9" step="0.02" value="0.55" />
          </div>

          <!-- Action buttons -->
          <div class="control-actions">
            <button id="btnMagnet3D" class="action-btn action-btn-primary" type="button">
              <span>🧲 Hút chữ L</span>
            </button>
            <button id="btnReset3D" class="action-btn" type="button">
              <span>↺ Thả tự do</span>
            </button>
          </div>
        </aside>

        <!-- Touch prompt -->
        <div class="touch-hint" id="touchHint">
          <div class="cloud-pill">
            <span>Chạm & kéo blob 3D</span>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
