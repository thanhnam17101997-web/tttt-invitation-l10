<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — TÌNH TÍNH TING TING</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(ellipse at 50% 30%, #311b48 0%, #15092a 55%, #080314 100%);
      color: #fff;
      font-family: 'Be Vietnam Pro', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .trap-card {
      width: min(560px, 94%);
      background: rgba(43, 20, 68, 0.7);
      border: 1.5px solid rgba(255, 140, 200, 0.3);
      border-radius: 24px;
      padding: 28px 20px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 51, 102, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .trap-badge {
      display: inline-block;
      background: #ff3366;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(255, 51, 102, 0.6);
    }

    .trap-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .trap-subtitle {
      font-size: 15px;
      color: #f7d2e8;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .trap-video-wrapper {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 60vh;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .trap-video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .trap-btn {
      display: inline-block;
      background: #ffe0ad;
      color: #34163b;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 24px;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .trap-btn:hover {
      background: #fff;
      transform: scale(1.03);
    }
  </style>
</head>

<body>
  <div class="trap-card">
    <h1 class="trap-title">ơ Hello</h1>
    <p class="trap-subtitle">thui em đùa em newbie, dập đầu van xin đó</p>
    <div class="trap-video-wrapper">
      <video id="trapVideo" src="/assets/hang-mu.mp4" autoplay loop playsinline controls></video>
    </div>
    <a href="/" class="trap-btn">Quay lại trang chủ</a>
  </div>
  <script>
    const v = document.getElementById('trapVideo');
    // Trình duyệt chặn autoplay có tiếng — unmute ngay khi user chạm/click
    function unmute() {
      if (v) { v.muted = false; v.play().catch(() => {}); }
      document.removeEventListener('click', unmute);
      document.removeEventListener('touchstart', unmute);
    }
    document.addEventListener('click', unmute);
    document.addEventListener('touchstart', unmute);

    console.log(
      '%c[VAN XIN] %cThui em đùa em newbie, dập đầu van xin anh em đừng nghịch nữa! 🙇‍♂️',
      'color: #ff3366; font-size: 15px; font-weight: bold;',
      'color: #ffe0ad; font-size: 13px;'
    );
  </script>
</body>

</html>
